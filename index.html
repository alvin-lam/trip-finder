<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="claude:viewport-fit-sides" content="cover" />
  <title>Where to Travel | All Trips Considered</title>
  <meta name="description" content="Answer a few quick questions and get ranked regions, countries and cities to visit, with a suggested itinerary." />
  <link rel="icon" href="img/favicon.ico" sizes="48x48" />
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="img/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#005bd9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Where to Travel" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#" data-nav="plan" aria-label="All Trips Considered: Where to Travel home">
        <span class="brand__mark" aria-hidden="true">🧭</span>
        <span class="brand__text">
          <span class="brand__name">All Trips Considered</span>
          <span class="brand__sub">Where to Travel</span>
        </span>
      </a>
      <nav class="tabs" aria-label="Main">
        <button class="tab" data-nav="plan" aria-current="page">Plan</button>
        <button class="tab" data-nav="explore">Explore</button>
        <button class="tab" data-nav="shortlist">Shortlist <span class="badge" id="shortlist-count" hidden>0</span></button>
      </nav>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <!-- Views are rendered by js/app.js -->
    <section id="view-plan" class="view"></section>
    <section id="view-explore" class="view" hidden></section>
    <section id="view-shortlist" class="view" hidden></section>
  </main>

  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <div class="detail__body" id="detail-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer">
    <p>Scores and seasons are rough planning guides. Always check current travel advisories, entry rules and local conditions before you book.</p>
    <p class="footer__copy">© <span data-year>2026</span> <a href="https://www.alltripsconsidered.com" target="_blank" rel="noopener">AllTripsConsidered.com</a>. All rights reserved.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
